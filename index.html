    <script>
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const reg of registrations) {
              reg.unregister();
            }
          }).catch(() => {});
        }
        if ('caches' in window) {
          caches.keys().then(names => {
            for (const name of names) {
              try { caches.delete(name); } catch (ce) {}
            }
          }).catch(() => {});
        }
      } catch (globalError) {}
    </script>
