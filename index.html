<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gold Avenue - Investissement en Or & Gestion de Fortune</title>
    
    <!-- Google Fonts & Serif Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Roboto+Serif:ital,opsz,wght@0,8..144,300..900;1,8..144,300..900&display=swap" rel="stylesheet">
    
    <!-- PWA Configurations -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#eab308" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gold Avenue" />
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/gold-bars.png" />
    
    <script>
      try {
        // Détecter si l'application tourne dans un iframe (AISTUDIO Preview) ou en développement
        const isIframe = window.self !== window.top;
        const isDev = window.location.hostname.includes('localhost') || window.location.hostname.includes('127.0.0.1') || window.location.hostname.endsWith('.run.app');

        if (isIframe || isDev) {
          console.log('[PWA] Mode développement ou iframe détecté. Désactivation préventive du cache SW.');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
              let unregisteredAny = false;
              for (const reg of registrations) {
                reg.unregister();
                unregisteredAny = true;
              }
              if (unregisteredAny) {
                console.log('[PWA] Service Workers obsolètes désenregistrés.');
                if ('caches' in window) {
                   caches.keys().then(names => {
                     for (const name of names) {
                       try { caches.delete(name); } catch (ce) {}
                     }
                   });
                }
              }
            }).catch(err => {
              console.warn('[PWA] Échec de récupération des service workers.', err);
            });
          }
        } else {
          // Enregistrer le Service Worker uniquement en production isolée
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('/sw.js')
                .then(reg => {
                  console.log('PWA Service Worker enregistré avec succès !', reg);
                })
                .catch(err => {
                  console.error('Échec de l\'enregistrement du Service Worker PWA :', err);
                });
            });
          }
        }
      } catch (globalError) {
        console.warn('[PWA] Exception de script de démarrage de secours silencieusement interceptée :', globalError);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
